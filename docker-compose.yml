services:
  mongodb:
    image: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password1234
    ports:
      - "27017:27017"
    volumes:
      - db:/data/db

  backend:
    depends_on:
      - mongodb
    build: ./backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://root:password1234@mongodb:27017/tp-todolist?authSource=admin
      - CORS_ORIGIN=http://localhost:5173

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "5173:5173"

volumes:
  db: